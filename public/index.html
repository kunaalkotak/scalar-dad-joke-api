<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dad Joke API Reference | Scalar</title>
    <style>
      /* Shown only if the Scalar script cannot be downloaded from the CDN. */
      #load-error {
        display: none;
        max-width: 40rem;
        margin: 4rem auto;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        border: 2px solid #c0392b;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <!-- Scalar draws the whole documentation page inside this element. -->
    <div id="app"></div>

    <div id="load-error">
      <strong>Scalar could not be loaded.</strong>
      The script is downloaded from the jsDelivr CDN, so this page needs an internet connection.
      Check your connection and reload.
    </div>

    <!-- 1. Load Scalar from the CDN. The version is pinned so the demo behaves the same every day. -->
    <script
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.4"
      onerror="document.getElementById('load-error').style.display = 'block'"
    ></script>

    <!-- 2. Tell Scalar where our OpenAPI file is and how to look. -->
    <script>
      if (window.Scalar) {
        Scalar.createApiReference('#app', {
          // Our own specification, served by server.js from public/openapi.yaml
          url: '/openapi.yaml',

          // Visual options
          theme: 'purple',
          layout: 'modern',

          // The "Send" button in the built-in client defaults to JavaScript fetch snippets
          defaultHttpClient: { targetKey: 'js', clientKey: 'fetch' },

          // NOTE: no `proxyUrl` here on purpose. Scalar's own hosted proxy
          // (proxy.scalar.com) cannot reach http://localhost on our computer, and we
          // do not need it: the page and the API proxy come from the same
          // server, so the browser sends no cross-origin request.
        })
      }
    </script>
  </body>
</html>
